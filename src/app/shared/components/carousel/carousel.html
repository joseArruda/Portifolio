<section class="container-carousel">
  <img class="bg" src="{{ projects[currentIndex].video }}" alt="" />
  <div class="details-project-carousel">
    <a target="_blank" [href]="projects[currentIndex].link">
      <h2>{{ projects[currentIndex].title }}</h2>
    </a>
    <p>{{ projects[currentIndex].description }}</p>
  </div>
  <div class="carousel">
    <div class="carousel-track" [style.transform]="'translateX(-' + currentIndex * 100 + '%)'">
      <div class="slide" *ngFor="let project of projects">
        <div class="slide-bg"></div>
        <video autoplay muted loop playsinline preload="metadata" class="slide-video" alt="Banner">
          <source [src]="project.video" type="video/webm" />
          Seu navegador não suporta vídeos
        </video>
      </div>
    </div>

    <div class="dots">
      <svg class="arrow left" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
        <path
          fill="grey"
          d="m18.68 13.978l-3.21-3.21l-1.96-1.97a2.13 2.13 0 0 0-3.01 0l-5.18 5.18c-.68.68-.19 1.84.76 1.84h11.84c.96 0 1.44-1.16.76-1.84"
        />
      </svg>
      <img
        class="dots-image active"
        *ngFor="let project of projects; let i = index"
        [src]="project.image"
        [alt]="project.title"
        (click)="goTo(i)"
        width="50px"
      />
      <svg class="arrow right" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
        <path
          fill="grey"
          d="m18.68 13.978l-3.21-3.21l-1.96-1.97a2.13 2.13 0 0 0-3.01 0l-5.18 5.18c-.68.68-.19 1.84.76 1.84h11.84c.96 0 1.44-1.16.76-1.84"
        />
      </svg>
    </div>
  </div>
</section>
